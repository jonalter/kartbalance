---
layout: default
---
<div>
  {{ content }}
</div>
<div>
  <div class="iphone">
    <div id="screenshots">
      {% for screenshot in site.screenshots %}
        {% capture screenshot_path %}/assets/{{ screenshot }}.png{% endcapture %}
        {% capture screenshot_path2 %}/assets/{{ screenshot }}@2x.png{% endcapture %}
        <img alt="KartBalance app showing kart weight distribution calculator with corner weights and chassis diagram" src="{{ screenshot_path | prepend: site.baseurl }}" srcset="{{ screenshot_path2 | prepend: site.baseurl }} 2x" width="320" height="568">
      {% endfor %}
    </div>
  </div>
</div>
