# Common kart racing classes
# Used for reference and future page generation

- name: "LO206"
  slug: "lo206"
  full_name: "Briggs & Stratton LO206"
  engine_type: "4-stroke"
  min_weight: "340 lbs"
  typical_age: "15+"
  description: "The most popular four-stroke karting class in North America. Known for close, affordable racing with sealed engines that prevent modifications."
  weight_notes: "At 340 lbs minimum, most adult drivers need significant ballast. Weight placement is critical since the sealed engine limits power-based solutions to handling issues."

- name: "KA100"
  slug: "ka100"
  full_name: "IAME KA100"
  engine_type: "2-stroke"
  min_weight: "360 lbs"
  typical_age: "15+"
  description: "A popular two-stroke class offering significantly more power than LO206 while remaining relatively affordable and reliable."
  weight_notes: "Higher minimum weight than LO206 means even more ballast management is required. The additional power makes weight distribution even more impactful on corner exit speed."

- name: "X30"
  slug: "x30"
  full_name: "IAME X30"
  engine_type: "2-stroke"
  min_weight: "365 lbs"
  typical_age: "15+"
  description: "The premier TaG (Touch and Go) class worldwide, offering excellent power and reliability with electric starting and onboard battery."
  weight_notes: "The onboard battery and starter motor add to the kart's base weight and affect its distribution. Consider battery placement in your overall weight balance strategy."

- name: "Rok GP"
  slug: "rok-gp"
  full_name: "Vortex Rok GP"
  engine_type: "2-stroke"
  min_weight: "365 lbs"
  typical_age: "15+"
  description: "Vortex's flagship senior class engine, popular in the ROK Cup series worldwide, offering competitive two-stroke racing with sealed engine regulations."
  weight_notes: "Similar to X30 in weight class. The sealed engine format means chassis setup and weight distribution are the primary tuning variables available to teams."

- name: "Rotax Senior"
  slug: "rotax-senior"
  full_name: "Rotax Max Senior"
  engine_type: "2-stroke"
  min_weight: "365 lbs"
  typical_age: "15+"
  description: "Part of the global Rotax Max Challenge, this class features a regulated engine package with a distinctive powerband and excellent international racing opportunities."
  weight_notes: "The Rotax engine's unique power delivery characteristics make weight distribution especially important for managing the transition from low to high RPM power."

- name: "Rotax Junior"
  slug: "rotax-junior"
  full_name: "Rotax Max Junior"
  engine_type: "2-stroke"
  min_weight: "320 lbs"
  typical_age: "12-15"
  description: "The junior version of the Rotax Max package, providing a stepping stone for young drivers moving up from cadet classes with restricted power output."
  weight_notes: "Junior drivers often have less experience with chassis setup, making a tool like KartBalance especially valuable for learning weight distribution fundamentals."

- name: "Rotax Mini Max"
  slug: "rotax-mini-max"
  full_name: "Rotax Mini Max"
  engine_type: "2-stroke"
  min_weight: "265 lbs"
  typical_age: "10-13"
  description: "An entry-level Rotax class for younger drivers, featuring a restricted engine that provides an appropriate power level for developing racers."
  weight_notes: "At lower minimum weights, young drivers may not need much ballast. However, even small weight distribution changes have a proportionally larger effect on handling."

- name: "IAME X30 Junior"
  slug: "x30-junior"
  full_name: "IAME X30 Junior"
  engine_type: "2-stroke"
  min_weight: "320 lbs"
  typical_age: "12-15"
  description: "The junior variant of the X30 platform, offering restricted power for younger competitors while maintaining the reliability of the X30 engine package."
  weight_notes: "Junior weight minimums are lower, meaning lighter drivers may still need ballast. Strategic placement of any required weight is crucial at this level."

- name: "Shifter KZ"
  slug: "shifter-kz"
  full_name: "KZ / KZ2 Shifter"
  engine_type: "2-stroke (6-speed)"
  min_weight: "385 lbs"
  typical_age: "16+"
  description: "The pinnacle of sprint karting with six-speed sequential gearboxes, reaching speeds over 100 mph. Demands the highest level of driver skill and chassis setup."
  weight_notes: "The gearbox adds weight to the rear of the kart, creating a naturally rear-biased distribution. Front-end ballast placement is often necessary to achieve balanced handling."

- name: "TaG Senior"
  slug: "tag-senior"
  full_name: "TaG Senior (Touch and Go)"
  engine_type: "2-stroke"
  min_weight: "360 lbs"
  typical_age: "15+"
  description: "A general class designation for karts with electric-start two-stroke engines. Various engine manufacturers are typically permitted depending on the sanctioning body."
  weight_notes: "TaG classes typically allow various engines, so weight distribution strategy may vary based on the specific powerplant installed. Use KartBalance to establish a baseline and adjust."

- name: "Cadet"
  slug: "cadet"
  full_name: "Cadet (60cc/Mini)"
  engine_type: "2-stroke"
  min_weight: "230 lbs"
  typical_age: "8-12"
  description: "Entry-level racing for young drivers on smaller chassis with restricted 60cc engines, focusing on developing fundamental racing skills and racecraft."
  weight_notes: "Cadet karts have the lightest minimum weights, making every gram of ballast placement significant. Young drivers and their coaches benefit from precise weight measurement tools."

- name: "Kid Kart"
  slug: "kid-kart"
  full_name: "Kid Kart (Comer 50cc)"
  engine_type: "2-stroke"
  min_weight: "150 lbs"
  typical_age: "5-8"
  description: "The youngest category of kart racing, using small chassis and restricted 50cc engines for children getting their first taste of motorsport competition."
  weight_notes: "With such light overall weights, even the smallest changes in weight position can transform handling. Parents and coaches should use careful measurement to ensure safe, consistent setups."

- name: "206 Senior"
  slug: "206-senior"
  full_name: "Briggs 206 Senior"
  engine_type: "4-stroke"
  min_weight: "340 lbs"
  typical_age: "15+"
  description: "The adult division of Briggs 206 racing, sharing the sealed LO206 engine across all competitors for the closest, most affordable racing in karting."
  weight_notes: "Identical to LO206 class weights. Focus on achieving the ideal front-rear split for your specific track and conditions. Weight is your primary setup tool in sealed engine classes."

- name: "206 Junior"
  slug: "206-junior"
  full_name: "Briggs 206 Junior"
  engine_type: "4-stroke"
  min_weight: "290 lbs"
  typical_age: "12-15"
  description: "Junior division Briggs 206 racing, providing affordable four-stroke competition for younger drivers transitioning from cadet classes."
  weight_notes: "Lower minimum weight than senior classes, but the same sealed engine. Weight distribution becomes even more critical since all competitors have identical power output."
